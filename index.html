<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>LiveChat</title>
<meta name="description" content="LiveChat — real-time messaging" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%232563eb%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 font-family=%22Arial%22 fill=%22white%22 text-anchor=%22middle%22>L</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ==================== AUTH SCREEN ==================== -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">L</div>
      <h1>LiveChat</h1>
      <p class="brand-tag">Real-time messaging, done simply.</p>
    </div>

    <div id="auth-error" class="auth-error hidden" role="alert"></div>

    <!-- Login form -->
    <form id="login-form" class="auth-form" novalidate>
      <h2>Welcome back</h2>
      <label class="field">
        <span>Email</span>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required minlength="6" />
      </label>
      <button type="submit" class="btn-primary" id="login-btn">
        <span class="btn-label">Log In</span>
        <span class="btn-spinner hidden"></span>
      </button>
      <p class="auth-switch">Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
    </form>

    <!-- Signup form -->
    <form id="signup-form" class="auth-form hidden" novalidate>
      <h2>Create your account</h2>
      <label class="field">
        <span>Full name</span>
        <input type="text" id="signup-name" placeholder="Jane Doe" autocomplete="name" required minlength="2" />
      </label>
      <label class="field">
        <span>Email</span>
        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6" />
      </label>
      <button type="submit" class="btn-primary" id="signup-btn">
        <span class="btn-label">Create Account</span>
        <span class="btn-spinner hidden"></span>
      </button>
      <p class="auth-switch">Already have an account? <a href="#" id="show-login">Log in</a></p>
    </form>
  </div>
</div>

<!-- ==================== APP SCREEN ==================== -->
<div id="app-screen" class="app-screen hidden">
  <div class="app-shell" id="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="me">
          <div class="avatar" id="me-avatar">?</div>
          <div class="me-info">
            <div class="me-name" id="me-name">—</div>
            <div class="me-email" id="me-email">—</div>
          </div>
        </div>
        <button id="logout-btn" class="icon-btn" title="Log out" aria-label="Log out">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M16 17v-3H9v-4h7V7l5 5-5 5zM14 2a2 2 0 0 1 2 2v2h-2V4H5v16h9v-2h2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9z"/></svg>
        </button>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" class="search-icon"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input type="text" id="search-users" placeholder="Search people…" autocomplete="off" />
      </div>

      <div class="user-list" id="user-list">
        <div class="list-loading" id="list-loading">Loading people…</div>
      </div>
    </aside>

    <!-- Chat area -->
    <main class="chat-area" id="chat-area">

      <!-- Empty state -->
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-inner">
          <div class="chat-empty-icon">
            <svg viewBox="0 0 24 24" width="56" height="56"><path fill="currentColor" opacity="0.18" d="M4 4h16v12H7l-3 3z"/><path fill="currentColor" d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H7.83l-2.54 2.54A1 1 0 0 1 3.6 19.7L3 19V5a1 1 0 0 1 1-1zm1 2v10.59l1.29-1.3.7-.29H19V6H5z"/></svg>
          </div>
          <h2>Select a conversation</h2>
          <p>Pick someone from the list to start chatting in real time.</p>
        </div>
      </div>

      <!-- Active chat window -->
      <div class="chat-window hidden" id="chat-window">
        <header class="chat-header">
          <button class="icon-btn back-btn" id="back-btn" aria-label="Back">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <div class="avatar avatar-sm" id="chat-avatar">?</div>
          <div class="chat-header-info">
            <div class="chat-header-name" id="chat-header-name">—</div>
            <div class="chat-header-status" id="chat-header-status">—</div>
          </div>
        </header>

        <div class="messages" id="messages"></div>

        <div class="typing-row hidden" id="typing-row">
          <span id="typing-name">Someone</span> is typing
          <span class="typing-dots"><i></i><i></i><i></i></span>
        </div>

        <form class="message-input-area" id="message-form">
          <input type="text" id="message-input" placeholder="Type a message…" autocomplete="off" maxlength="2000" />
          <button type="submit" class="send-btn" id="send-btn" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>
    </main>
  </div>
</div>

<!-- Toast for transient errors / info -->
<div id="toast" class="toast hidden"></div>

<script type="module" src="app.js"></script>
</body>
</html>
